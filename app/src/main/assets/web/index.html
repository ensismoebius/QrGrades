<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QrGrades</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="login-screen">
    <form id="login-card" autocomplete="off">
        <img class="app-logo" src="/favicon.svg" alt="" width="56" height="56">
        <h1>QrGrades</h1>
        <input type="password" id="login-password" placeholder="Senha" autofocus>
        <div id="login-error"></div>
        <button type="submit" class="btn" style="width:100%">Entrar</button>
    </form>
</div>

<div id="app-shell" class="hidden">
    <header>
        <div class="row" style="margin:0">
            <img class="app-logo" src="/favicon.svg" alt="" width="28" height="28">
            <h1>QrGrades</h1>
        </div>
        <button class="btn secondary" id="logout-btn">Sair</button>
    </header>
    <nav id="tab-nav">
        <button data-tab="overview" class="active">Visão geral</button>
        <button data-tab="alerts">Alertas</button>
        <button data-tab="students">Alunos</button>
        <button data-tab="points">Lançar pontos</button>
        <button data-tab="attendance">Frequência</button>
        <button data-tab="history">Histórico</button>
        <button data-tab="periods">Períodos</button>
        <button data-tab="disciplines">Disciplinas</button>
        <button data-tab="classgroups">Turmas</button>
        <button data-tab="goals">Metas</button>
        <button data-tab="qrcodes">Códigos QR</button>
        <button data-tab="data">Importar / Exportar</button>
    </nav>
    <main>
        <section class="tab active" id="tab-overview"></section>
        <section class="tab" id="tab-alerts"></section>
        <section class="tab" id="tab-students"></section>
        <section class="tab" id="tab-points"></section>
        <section class="tab" id="tab-attendance"></section>
        <section class="tab" id="tab-history"></section>
        <section class="tab" id="tab-periods"></section>
        <section class="tab" id="tab-disciplines"></section>
        <section class="tab" id="tab-classgroups"></section>
        <section class="tab" id="tab-goals"></section>
        <section class="tab" id="tab-qrcodes"></section>
        <section class="tab" id="tab-data"></section>
    </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<!-- app.js defines window.QG; each screen below registers itself with it. -->
<script src="/app.js"></script>
<script src="/js/insights.js"></script>
<script src="/js/history.js"></script>
<script src="/js/points.js"></script>
<script src="/js/attendance.js"></script>
<script src="/js/periods.js"></script>
<script src="/js/alerts.js"></script>
</body>
</html>
